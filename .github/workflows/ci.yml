name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # x.yy.zzz (versions.json, scripts/version.mjs): yy counts days with changes, zzz is this run.
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: echo "app=$(node scripts/version.mjs app)" >> "$GITHUB_OUTPUT"
      - run: echo "### Trips ${{ steps.v.outputs.app }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Smoke test: start the image once and wait for /healthz before anything is pushed.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: trips:smoke
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /healthz
        run: |
          docker run -d --name smoke -p 41873:41873 -e SESSION_KEY=ci-smoke-test-key-0123456789 -e PUBLIC_URL=http://localhost:41873 trips:smoke
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/health.json http://localhost:41873/healthz; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q "\"version\":\"$VERSION\"" /tmp/health.json
          echo "Healthcheck: \`$(cat /tmp/health.json)\`" >> "$GITHUB_STEP_SUMMARY"
          docker logs smoke

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        name: Push amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request'
        run: |
          echo "Image: \`${IMAGE}:${VERSION}\` und \`:latest\` (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
